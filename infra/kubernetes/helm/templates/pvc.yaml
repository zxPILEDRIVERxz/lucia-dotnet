{{- /*
Persistent Volume Claim for plugin storage (/app/plugins).

Only rendered when plugins are enabled AND no existing claim is supplied.
Bundled plugins are seeded into the volume by the seed-plugins init container
on every pod start (no-clobber); repository-installed plugins persist in it.
NEVER delete this PVC on upgrades — installed plugins live there.
With more than one replica the claim must be ReadWriteMany (set plugins.accessMode
and a RWX-capable plugins.storageClass).
*/ -}}
{{- if and .Values.plugins.enabled (not .Values.plugins.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "%s-plugins" (include "lucia.fullname" .) }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "lucia.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.plugins.accessMode }}
  {{- if .Values.plugins.storageClass }}
  storageClassName: {{ .Values.plugins.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.plugins.size | quote }}
{{- end }}
